name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dellanno-singular-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_DEPLOY_PATH: ${{ secrets.SSH_DEPLOY_PATH }}
      SSH_DEPLOY_PATH_EN: ${{ secrets.SSH_DEPLOY_PATH_EN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Portuguese frontend
        env:
          VITE_APP_LANG: pt

          VITE_FACEBOOK_URL: https://www.facebook.com/DellAnnoOficial/
          VITE_INSTAGRAM_URL: https://www.instagram.com/dellannooficial/
          VITE_PINTEREST_URL: https://br.pinterest.com/dellanno/
          VITE_YOUTUBE_URL: https://www.youtube.com/c/DellAnnoOficial

          VITE_POLITICA_URL: https://dellanno.com.br/politica
        run: |
          npm run build -- --outDir dist/pt
          test -s dist/pt/index.html

      - name: Build English frontend
        env:
          VITE_APP_LANG: en

          VITE_FACEBOOK_URL: https://www.facebook.com/dellannohomedesign
          VITE_INSTAGRAM_URL: https://www.instagram.com/dellannohomedesign/
          VITE_PINTEREST_URL: https://br.pinterest.com/dellanno/
          VITE_YOUTUBE_URL: https://www.youtube.com/@DellAnnoofficial

          VITE_POLITICA_URL: https://dellanno.com/cookie-policy/
        run: |
          npm run build -- --outDir dist/en
          test -s dist/en/index.html

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy each language to its path
        shell: bash
        run: |
          set -euo pipefail
          for language in pt en; do
            case "$language" in
              pt) path="$SSH_DEPLOY_PATH" ;;
              en) path="$SSH_DEPLOY_PATH_EN" ;;
            esac
            ssh -o BatchMode=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
              "mkdir -p -- '$path'"

            # Publish only Vite output. Keep server configuration and older assets.
            rsync -az --delay-updates \
              --exclude='.htaccess' \
              --exclude='.env' \
              -e "ssh -o BatchMode=yes -p $SSH_PORT" \
              "dist/$language/" "$SSH_USER@$SSH_HOST:${path%/}/"
          done